<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />
  <circle cx="256" cy="256" r="220" fill="url(#glow)" />

  <!-- Calibrated Pitch Tactical Vanishing Lines -->
  <path d="M 56 360 L 456 360 M 110 300 L 402 300 M 160 250 L 352 250" stroke="#1e293b" stroke-width="2.5" />
  <line x1="256" y1="200" x2="256" y2="440" stroke="#38bdf8" stroke-dasharray="6,6" stroke-width="2" />

  <!-- Shield Boundary -->
  <path d="M 256 70 L 396 120 C 396 270 256 390 256 390 C 256 390 116 270 116 120 Z" fill="url(#shield)" fill-opacity="0.15" stroke="url(#shield)" stroke-width="8" stroke-linejoin="round" />

  <!-- VAR Bold Monogram -->
  <text x="256" y="240" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="100" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">VAR</text>
  <text x="256" y="280" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="6">APEX · AI</text>

  <!-- Crosshair & Targeting Reticle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="24,12" opacity="0.6" />
  <circle cx="256" cy="256" r="6" fill="#ef4444" />
  <line x1="256" y1="60" x2="256" y2="100" stroke="#ef4444" stroke-width="4" />
  <line x1="256" y1="412" x2="256" y2="452" stroke="#ef4444" stroke-width="4" />
  <line x1="60" y1="256" x2="100" y2="256" stroke="#ef4444" stroke-width="4" />
  <line x1="412" y1="256" x2="452" y2="256" stroke="#ef4444" stroke-width="4" />
</svg>
